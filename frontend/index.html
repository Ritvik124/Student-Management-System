<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Management System</h1>
    </header>
    <main>
        <div id="controls">
            <button onclick="fetchStudents()">Load Students</button>
            <button onclick="showAddForm()">Add Student</button>
            <input type="text" id="searchInput" placeholder="Search..." oninput="filterStudents()">
        </div>
        
        <table id="studentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>

        <!-- Simple Form Modal for simplicity -->
        <div id="formModal" style="display:none; position:fixed; top:20%; left:30%; background:#fff; padding:20px; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.5);">
            <h2 id="formTitle">Add Student</h2>
            <form id="studentForm" onsubmit="saveStudent(event)">
                <input type="hidden" id="studentId">
                <input type="text" id="rollNumber" placeholder="Roll Number" required><br><br>
                <input type="text" id="firstName" placeholder="First Name" required><br><br>
                <input type="text" id="lastName" placeholder="Last Name" required><br><br>
                <input type="email" id="email" placeholder="Email" required><br><br>
                <input type="text" id="department" placeholder="Department" required><br><br>
                <input type="number" id="year" placeholder="Year" required><br><br>
                <input type="number" step="0.1" id="cgpa" placeholder="CGPA"><br><br>
                <button type="submit">Save</button>
                <button type="button" onclick="closeForm()">Cancel</button>
            </form>
        </div>
    </main>

    <script>
        const API_BASE_URL = window.API_BASE_URL || "http://localhost:8080";
        let allStudents = [];

        async function fetchStudents() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/students`);
                if (res.ok) {
                    allStudents = await res.json();
                    renderStudents(allStudents);
                } else {
                    alert("Error loading students");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to connect to API");
            }
        }

        function renderStudents(students) {
            const tbody = document.querySelector("#studentsTable tbody");
            tbody.innerHTML = "";
            students.forEach(s => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${s.id}</td>
                    <td>${s.rollNumber}</td>
                    <td>${s.firstName} ${s.lastName}</td>
                    <td>${s.email}</td>
                    <td>${s.department}</td>
                    <td>
                        <button onclick='editStudent(${JSON.stringify(s)})'>Edit</button>
                        <button onclick="deleteStudent(${s.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterStudents() {
            const val = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.rollNumber.toLowerCase().includes(val) || 
                s.firstName.toLowerCase().includes(val) || 
                s.lastName.toLowerCase().includes(val) || 
                s.email.toLowerCase().includes(val) || 
                s.department.toLowerCase().includes(val)
            );
            renderStudents(filtered);
        }

        function showAddForm() {
            document.getElementById("formTitle").innerText = "Add Student";
            document.getElementById("studentForm").reset();
            document.getElementById("studentId").value = "";
            document.getElementById("formModal").style.display = "block";
        }

        function editStudent(s) {
            document.getElementById("formTitle").innerText = "Edit Student";
            document.getElementById("studentId").value = s.id;
            document.getElementById("rollNumber").value = s.rollNumber;
            document.getElementById("firstName").value = s.firstName;
            document.getElementById("lastName").value = s.lastName;
            document.getElementById("email").value = s.email;
            document.getElementById("department").value = s.department;
            document.getElementById("year").value = s.year;
            document.getElementById("cgpa").value = s.cgpa;
            document.getElementById("formModal").style.display = "block";
        }

        function closeForm() {
            document.getElementById("formModal").style.display = "none";
        }

        async function saveStudent(e) {
            e.preventDefault();
            const id = document.getElementById("studentId").value;
            const data = {
                rollNumber: document.getElementById("rollNumber").value,
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                email: document.getElementById("email").value,
                department: document.getElementById("department").value,
                year: parseInt(document.getElementById("year").value),
                cgpa: parseFloat(document.getElementById("cgpa").value || 0),
                address: ""
            };

            const method = id ? "PUT" : "POST";
            const url = id ? `${API_BASE_URL}/api/students/${id}` : `${API_BASE_URL}/api/students`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    closeForm();
                    fetchStudents();
                } else {
                    alert("Error saving student");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to save");
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure?")) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/students/${id}`, { method: "DELETE" });
                if (res.ok || res.status === 204) {
                    fetchStudents();
                } else {
                    alert("Error deleting");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to delete");
            }
        }

        fetchStudents();
    </script>
</body>
</html>
