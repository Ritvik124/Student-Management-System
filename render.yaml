services:
  - type: web
    name: student-management-backend
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://your-frontend.netlify.app

databases:
  - name: student-management-db
    plan: free
